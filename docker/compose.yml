# Shed Stem Studio en Docker. Todo queda en tu máquina: los puertos se publican solo en 127.0.0.1.
# Uso:  docker compose up -d --build   (sin configurar nada: todo queda en docker/data/)
# Para mover carpetas a otro disco: copiá .env.example a .env y cambiá las rutas.
# `docker compose up` levanta todo: motor, servidor de modelos (Ollama) e interfaz.
# No se descarga ningún modelo solo: se eligen y se bajan desde Ajustes, a la carpeta que indiques.
name: stemshed

services:
  # Prepara las carpetas (Docker las crea como root) y se las entrega al usuario del motor. Corre una vez y termina.
  init:
    image: stemshed-engine:latest
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "mkdir -p /models/separation && chown ${STEMSHED_UID:-1000}:${STEMSHED_GID:-1000} /config /data /env /models/separation"]
    volumes:
      - ${STEMSHED_CONFIG:-${STEMSHED_HOME:-./data}/config}:/config
      - ${STEMSHED_DATA:-${STEMSHED_HOME:-./data}/stemshed}:/data
      - ${STEMSHED_ENV:-${STEMSHED_HOME:-./data}/env}:/env
      - ${STEMSHED_SEP_MODELS:-${STEMSHED_HOME:-./data}/models/separation}:/models/separation

  engine:
    build: { context: .., dockerfile: docker/Dockerfile.engine }
    image: stemshed-engine:latest
    user: "${STEMSHED_UID:-1000}:${STEMSHED_GID:-1000}"
    restart: on-failure   # un apagado desde Ajustes no lo reinicia solo
    environment:
      STEMSHED_OLLAMA: http://ollama:11434
      STEMSHED_DEFAULT_MUSIC: /music
      STEMSHED_NO_SCHEDULER: ${STEMSHED_NO_SCHEDULER:-}
      # Dónde están las carpetas en tu equipo (Ajustes las muestra; se cambian en docker/.env y se vuelve a levantar).
      STEMSHED_HOST_DATA: ${STEMSHED_DATA:-${STEMSHED_HOME:-./data}/stemshed}
      STEMSHED_HOST_ENV: ${STEMSHED_ENV:-${STEMSHED_HOME:-./data}/env}
      STEMSHED_HOST_SEP_MODELS: ${STEMSHED_SEP_MODELS:-${STEMSHED_HOME:-./data}/models/separation}
      STEMSHED_HOST_LLM_MODELS: ${STEMSHED_LLM_MODELS:-${STEMSHED_HOME:-./data}/models/ollama}
      STEMSHED_ORIGINS: ${STEMSHED_ORIGINS:-http://127.0.0.1:5173}
    volumes:
      - ${STEMSHED_CONFIG:-${STEMSHED_HOME:-./data}/config}:/config
      - ${STEMSHED_DATA:-${STEMSHED_HOME:-./data}/stemshed}:/data
      - ${STEMSHED_ENV:-${STEMSHED_HOME:-./data}/env}:/env                 # entorno de separación (se instala desde Ajustes)
      - ${STEMSHED_SEP_MODELS:-${STEMSHED_HOME:-./data}/models/separation}:/models/separation
      - ${STEMSHED_MUSIC:-${STEMSHED_HOME:-./data}/music}:/music:ro
    devices:
      - nvidia.com/gpu=all          # CDI: requiere nvidia-container-toolkit en el host
    depends_on:
      init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    ports: ["127.0.0.1:${STEMSHED_ENGINE_PORT:-8770}:8770"]
    # Sin GPU: borrá `devices` (la separación va a CPU, muy lenta).

  ollama:
    image: ollama/ollama
    # Imagen de ≈ 3,4 GB comprimida: se baja la primera vez que se levanta todo.
    restart: on-failure   # un apagado desde Ajustes no lo reinicia solo
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${STEMSHED_LLM_MODELS:-${STEMSHED_HOME:-./data}/models/ollama}:/root/.ollama/models
    devices:
      - nvidia.com/gpu=all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    # Sin `ports`: solo el motor lo alcanza, por la red interna de compose.

  web:
    build: { context: .., dockerfile: docker/Dockerfile.web }
    restart: on-failure   # un apagado desde Ajustes no lo reinicia solo
    depends_on: [engine]
    ports: ["127.0.0.1:${STEMSHED_WEB_PORT:-5173}:80"]
