<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Shed Stem Studio</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #14110f; color: #e9e2d8; font: 15px system-ui, sans-serif; }
  main { text-align: center; max-width: 34rem; padding: 0 1.5rem; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 1rem; }
  .bar { width: 12rem; height: 3px; margin: 0 auto 1rem; background: #2c2622; overflow: hidden; border-radius: 2px; }
  .bar i { display: block; width: 40%; height: 100%; background: #d9a441; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #msg { opacity: .75; white-space: pre-wrap; }
  .error .bar { display: none; }
  .error #msg { color: #f0a08a; opacity: 1; text-align: left; }
</style>
</head>
<body>
<main id="m">
  <h1>Shed Stem Studio</h1>
  <div class="bar"><i></i></div>
  <p id="msg">Arrancando el motor…</p>
</main>
</body>
</html>
